<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Weather Models | 24hr QPF</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f4f4f9; 
            margin: 0; 
            padding: 15px; 
            text-align: center; 
        }
        .header { margin-bottom: 15px; }
        .header h1 { margin: 0 0 5px 0; font-size: 24px; }
        .header p { margin: 0; font-size: 14px; color: #555; }
        
        .controls { margin-bottom: 20px; }
        button { 
            background-color: #003E94; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            margin: 0 4px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 15px; 
            transition: 0.2s; 
        }
        button:hover { background-color: #207CE8; }
        button.active { background-color: #CD0000; font-weight: bold; }
        
        /* Dynamically lock the container height to the remaining screen space */
        .map-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: calc(100vh - 140px); 
        }
        
        /* Ensure the image scales proportionally and never exceeds the container */
        .map-container img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            border: 1px solid #ccc; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            border-radius: 4px; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI Weather Models | 24hr QPF (12z-12z)</h1>
        <p>Models displayed: GraphCast (GFS/IFS), NCEP AIGFS, ECMWF AIFS. (Use <b>←</b> and <b>→</b> arrow keys to navigate)</p>
    </div>

    <div class="controls" id="btn-group">
        <button class="active" onclick="changeDay(1)">Day 1</button>
        <button onclick="changeDay(2)">Day 2</button>
        <button onclick="changeDay(3)">Day 3</button>
        <button onclick="changeDay(4)">Day 4</button>
        <button onclick="changeDay(5)">Day 5</button>
        <button onclick="changeDay(6)">Day 6</button>
        <button onclick="changeDay(7)">Day 7</button>
    </div>

    <div class="map-container">
        <img id="qpf-map" src="images/day1.png" alt="AI 24hr QPF">
    </div>

    <script>
        // Track the current day to allow relative keyboard navigation
        let currentDay = 1;

        function changeDay(day) {
            currentDay = day;
            
            // Update the image and bust the cache
            document.getElementById('qpf-map').src = 'images/day' + day + '.png?t=' + new Date().getTime(); 
            
            // Reassign the active class to the selected button
            const buttons = document.querySelectorAll('.controls button');
            buttons.forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.controls button:nth-child(${day})`).classList.add('active');
        }

        // Global listener for Left and Right arrow keys
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight') {
                if (currentDay < 7) {
                    changeDay(currentDay + 1);
                }
            } else if (event.key === 'ArrowLeft') {
                if (currentDay > 1) {
                    changeDay(currentDay - 1);
                }
            }
        });
    </script>
</body>
</html>

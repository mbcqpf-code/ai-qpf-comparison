<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Weather Models | 24hr QPF</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        .header { margin-bottom: 20px; }
        .controls { margin-bottom: 30px; }
        button { background-color: #003E94; color: white; border: none; padding: 10px 20px; margin: 0 5px; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background-color: #207CE8; }
        button.active { background-color: #CD0000; font-weight: bold; }
        .map-container img { max-width: 100%; height: auto; border: 1px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI Weather Models | 24hr QPF (12z-12z)</h1>
        <p>Models displayed: GraphCast (GFS/IFS), NCEP AIGFS, ECMWF AIFS.</p>
    </div>

    <div class="controls" id="btn-group">
        <button class="active" onclick="changeDay(1)">Day 1</button>
        <button onclick="changeDay(2)">Day 2</button>
        <button onclick="changeDay(3)">Day 3</button>
        <button onclick="changeDay(4)">Day 4</button>
        <button onclick="changeDay(5)">Day 5</button>
        <button onclick="changeDay(6)">Day 6</button>
        <button onclick="changeDay(7)">Day 7</button>
    </div>

    <div class="map-container">
        <img id="qpf-map" src="images/day1.png" alt="AI 24hr QPF">
    </div>

    <script>
        function changeDay(day) {
            // Update the image
            document.getElementById('qpf-map').src = 'images/day' + day + '.png?t=' + new Date().getTime(); // ?t= prevents caching old images
            
            // Update active button styling
            const buttons = document.querySelectorAll('.controls button');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>

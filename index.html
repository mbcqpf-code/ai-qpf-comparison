<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Weather Models | 24hr QPF</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f4f4f9; 
            margin: 0; 
            padding: 15px; 
            text-align: center; 
        }
        .header { margin-bottom: 15px; }
        .header h1 { margin: 0 0 5px 0; font-size: 24px; }
        .header p { margin: 0; font-size: 14px; color: #555; }
        
        .controls { margin-bottom: 15px; }
        button { 
            background-color: #003E94; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            margin: 0 4px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 15px; 
            transition: 0.2s; 
        }
        button:hover { background-color: #207CE8; }
        button.active { background-color: #CD0000; font-weight: bold; }

        .run-info {
            font-size: 14px;
            color: #444;
            margin-bottom: 10px;
            background: #e0e6ed;
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
        }
        
        .map-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: calc(100vh - 190px); 
        }
        
        .map-container img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            border: 1px solid #ccc; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            border-radius: 4px; 
            background: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI Weather Models | 24hr QPF (12z-12z)</h1>
        <p>Models displayed: GraphCast (GFS/IFS), NCEP AIGFS, ECMWF AIFS. (Use <b>←/→</b> for Lead Day, <b>↑/↓</b> for Cycle Trend)</p>
        <a href="archive.html" target="_blank" style="display: inline-block; margin-top: 10px; padding: 6px 12px; background: #555; color: white; text-decoration: none; border-radius: 4px; font-size: 14px;">View Full Archive ↗</a>
    </div>

    <div class="controls" id="btn-group">
        <button class="active" onclick="changeDay(1)">Day 1</button>
        <button onclick="changeDay(2)">Day 2</button>
        <button onclick="changeDay(3)">Day 3</button>
        <button onclick="changeDay(4)">Day 4</button>
        <button onclick="changeDay(5)">Day 5</button>
        <button onclick="changeDay(6)">Day 6</button>
        <button onclick="changeDay(7)">Day 7</button>
    </div>

    <div class="run-info" id="run-info">Loading cycle data...</div>

    <div class="map-container">
        <img id="qpf-map" src="images/day1.png" alt="AI 24hr QPF">
    </div>

    <script>
        let currentDay = 1;
        let availableRuns = [];
        let currentRunIndex = 0; 

        // Helper to calculate the exact Valid Date (YYYY-MM-DD) based on Python script logic
        function getValidDateStr(runStr, dayNum) {
            let y = parseInt(runStr.substring(0,4));
            let m = parseInt(runStr.substring(4,6)) - 1; // JS months are 0-indexed
            let d = parseInt(runStr.substring(6,8));
            // Both 00z and 12z cycles for the same calendar date share the identical valid bounds
            let vDate = new Date(Date.UTC(y, m, d + (dayNum - 1)));
            return vDate.toISOString().split('T')[0];
        }

        async function loadLatestAndArchive() {
            try {
                const response = await fetch('images/archive/archive_list.json?t=' + new Date().getTime());
                availableRuns = await response.json();
                updatePlot();
            } catch (error) {
                console.warn("Archive database not found yet.");
                updatePlot();
            }
        }

        function changeDay(day) {
            currentDay = day;
            const buttons = document.querySelectorAll('.controls button');
            buttons.forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.controls button:nth-child(${day})`).classList.add('active');
            updatePlot();
        }

        function updatePlot() {
            const img = document.getElementById('qpf-map');
            const info = document.getElementById('run-info');

            if (availableRuns.length > 0) {
                const run = availableRuns[currentRunIndex];
                let yr = run.substring(0,4), mo = run.substring(4,6), dy = run.substring(6,8), hr = run.substring(8,10);
                
                // Calculate valid date to display in the UI
                let validDate = getValidDateStr(run, currentDay);
                let validEnd = new Date(Date.UTC(parseInt(yr), parseInt(mo)-1, parseInt(dy) + currentDay));
                let validEndStr = validEnd.toISOString().split('T')[0];

                img.src = `images/archive/${run}/day${currentDay}.png?t=` + new Date().getTime();
                
                let validText = `Valid: <b>${validDate} 12z to ${validEndStr} 12z</b>`;
                if (currentRunIndex === 0) {
                    info.innerHTML = `${validText} | Cycle: Latest Run (${yr}-${mo}-${dy} ${hr}z)`;
                } else {
                    info.innerHTML = `${validText} | Cycle: Historical (${yr}-${mo}-${dy} ${hr}z) &mdash; <i>Press &uarr; to return to newest</i>`;
                }
            } else {
                img.src = `images/day${currentDay}.png?t=` + new Date().getTime();
                info.innerHTML = `Cycle: <b>Latest Local Run</b>`;
            }
        }

        // Global listener for 4-way arrow key navigation
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight') {
                if (currentDay < 7) changeDay(currentDay + 1);
            } else if (event.key === 'ArrowLeft') {
                if (currentDay > 1) changeDay(currentDay - 1);
            } else if (event.key === 'ArrowDown') {
                event.preventDefault(); 
                if (availableRuns.length > 0 && currentRunIndex < availableRuns.length - 1) {
                    // Lock the Target Valid Date
                    let targetValid = getValidDateStr(availableRuns[currentRunIndex], currentDay);
                    let nextIndex = currentRunIndex + 1;
                    let foundDay = null;
                    
                    // Search the older cycle to find which Day button matches our locked Valid Date
                    for (let d = 1; d <= 7; d++) {
                        if (getValidDateStr(availableRuns[nextIndex], d) === targetValid) {
                            foundDay = d; 
                            break;
                        }
                    }
                    
                    if (foundDay !== null) {
                        currentRunIndex = nextIndex;
                        changeDay(foundDay);
                    }
                }
            } else if (event.key === 'ArrowUp') {
                event.preventDefault(); 
                if (availableRuns.length > 0 && currentRunIndex > 0) {
                    let targetValid = getValidDateStr(availableRuns[currentRunIndex], currentDay);
                    let prevIndex = currentRunIndex - 1;
                    let foundDay = null;
                    
                    for (let d = 1; d <= 7; d++) {
                        if (getValidDateStr(availableRuns[prevIndex], d) === targetValid) {
                            foundDay = d; 
                            break;
                        }
                    }
                    
                    if (foundDay !== null) {
                        currentRunIndex = prevIndex;
                        changeDay(foundDay);
                    }
                }
            }
        });

        window.onload = loadLatestAndArchive;
    </script>
</body>
</html>

name: Update AI Model QPF Plots

on:
  schedule:
    - cron: '0 11,23 * * *' # Runs at 7 AM and 7 PM EDT
  workflow_dispatch:        # Allows manual run via GitHub button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install OS-Level Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes0 eccodes-tools

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Plotting Script
        run: python scripts/generate_plots.py

      - name: Commit and Push Images
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add images/
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated update of AI QPF plots"
          git push
